version: "3.8"

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --set redpanda.auto_create_topics_enabled=true
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"

  postgres-primary:
    image: bitnami/postgresql:latest
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=${DB_USER:-postgres}
      - POSTGRESQL_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRESQL_DATABASE=${DB_NAME:-guitar_shop_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guitar_shop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: bitnami/postgresql:latest
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=postgres-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_PASSWORD=${DB_PASSWORD:-password}
    ports:
      - "5433:5432"
    depends_on:
      - postgres-primary

  redis:
    image: redis:7-alpine

  recs_worker:
    restart: always
    build:
      context: .
      dockerfile: recs_worker/Dockerfile
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_HOST=postgres-primary
      - DB_NAME=${DB_NAME:-guitar_shop_db}
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_started

  notifications_service:
    restart: always
    build:
      context: .
      dockerfile: notifications_service/Dockerfile
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
    depends_on:
      - redpanda

  orders_service:
    restart: always
    build:
      context: .
      dockerfile: orders_service/Dockerfile
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_HOST=postgres-primary
      - DB_NAME=${DB_NAME:-guitar_shop_db}
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-SUPER_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
    depends_on:
      redpanda:
        condition: service_started
      postgres-primary:
        condition: service_healthy
    deploy:
      replicas: 2

  products_service:
    restart: always
    build:
      context: .
      dockerfile: products_service/Dockerfile
    working_dir: /app/products_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_HOST=postgres-primary
      - DB_NAME=${DB_NAME:-guitar_shop_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-SUPER_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - API_KEY=${API_KEY}
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "50051"

  auth_service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    container_name: auth_service
    working_dir: /app/auth_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./.env
    environment:
      - PYTHONPATH=/app
    depends_on:
      postgres-primary:
        condition: service_healthy

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - orders_service
      - products_service
      - auth_service

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - orders_service
      - products_service
      - auth_service

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - loki
